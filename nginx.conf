server {
    # Coolify's proxy terminates TLS and forwards plain HTTP to this port.
    # Never redirect to https in here: it loops behind the proxy.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The form markup changes on every edit; never let a stale copy stick.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
